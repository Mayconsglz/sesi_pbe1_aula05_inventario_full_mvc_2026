<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
</head>
<body>
    <header><h1>Inventário</h1></header>
    <main>
        <section>
            <form action="http://localhost:3000/bens" method="post">
                <input type="text" name="item" placeholder="Nome do item" required>
                <input type="text" name="local" placeholder="Local" required>
                <input type="date" name="dataRegistro" required>
                <input type="number" step="0.01" name="valor" placeholder="Valor do item" required>
                <input type="text" name="patrimonio" placeholder="Número de patrimonio" required>
                <button type="submit">Enviar
            </form>
        </section>
        <section>
            <table border="1">
                <thead>
                    <th>Itens</th>
                    <th>Local</th>
                    <th>Data</th>
                    <th>Valor</th>
                    <th>Patrimonio</th>
                </thead>
                <tbody>

                </tbody>
            </table>
        </section>
    </main>
    <footer><h2>by Mayconsglz</h2></footer>
</body>
</html>
